[project]
name = "online-cinema-api"
version = "0.1.0"
description = "Backend API for an online cinema platform."
authors = [
    { name = "Oleksandr Merlenko", email = "s.merlenko@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn[standard] (>=0.52.4,<0.53.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "sqlalchemy[asyncio] (>=2.0.52,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "alembic (>=1.19.2,<2.0.0)",
    "pwdlib[argon2] (>=0.3.1,<0.4.0)",
    "email-validator (>=2.3.0,<3.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)"
]

[tool.poetry]
package-mode = false

[tool.mypy]
strict = true
plugins = [
    "pydantic.mypy"
]
exclude = "^migrations/versions/"

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra"]
strict = true
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.coverage.run]
source = ["src"]
branch = true
concurrency = ["greenlet"]

[tool.coverage.report]
show_missing = true
skip_empty = true
