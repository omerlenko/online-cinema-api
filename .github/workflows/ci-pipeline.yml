name: CI
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feature/setup-cd-ec2   # TEMPORARY: remove before opening the PR
permissions:
  contents: read
env:
  POSTGRES_USER: ci_user
  POSTGRES_PASSWORD: ci_password
  POSTGRES_DB: cinema_db
  POSTGRES_HOST: localhost
  POSTGRES_PORT: 5432
  JWT_SECRET_KEY: ci-only-not-a-real-secret-123456
  IMAGE_NAME: ghcr.io/omerlenko/online-cinema-api

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:18
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Poetry
        run: pipx install poetry

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "poetry"

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Check Code style (Black)
        run: poetry run black --check .

      - name: Lint Code (flake8)
        run: poetry run flake8

      - name: Check Static Types (mypy)
        run: poetry run mypy .

      - name: Apply migrations
        run: poetry run alembic upgrade head

      - name: Check models match migrations
        run: poetry run alembic check

      - name: Run Tests
        run: poetry run pytest --cov

  build-and-push:
    needs: test-and-lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker BuildX
        uses: docker/setup-buildx-action@v4

      - name: Login to ghcr
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
